name: Build Windows and Linux (Qt)

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt (shared + qttools)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.10.1'
          arch: win64_mingw
          static: false

      - name: Configure CMake
        shell: bash
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        shell: bash
        run: |
          cd build
          cmake --build .

      - name: Deploy Qt (windeployqt)
        shell: bash
        run: |
          cd build
          mkdir -p package
          cp EnsteinStockManager.exe package/
          windeployqt package/EnsteinStockManager.exe --qmldir ..

      - name: Create Windows ZIP
        shell: bash
        run: |
          cd build
          powershell -Command "Compress-Archive -Path package/* -DestinationPath ../EnsteinStockManager-Windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: EnsteinStockManager-Windows.zip

  build-linux:
    name: Linux Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.10.1'
          target: desktop

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libxcb-cursor0

      - name: Configure CMake
        shell: bash
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        shell: bash
        run: |
          cd build
          make -j$(nproc)

      - name: Install linuxdeployqt
        shell: bash
        run: |
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage
          ./linuxdeployqt-continuous-x86_64.AppImage --appimage-extract
          chmod +x squashfs-root/AppRun

      - name: Remove unsupported Qt plugin
        shell: bash
        run: |
          # linuxdeployqt aborts if any Qt plugin has missing deps.
          # Remove the Mimer SQL driver plugin (not used).
          find "$GITHUB_WORKSPACE" -path "*plugins/sqldrivers/libqsqlmimer.so" -delete || true
          if [ -n "$Qt6_DIR" ]; then
            find "$Qt6_DIR" -path "*plugins/sqldrivers/libqsqlmimer.so" -delete || true
          fi

      - name: Create desktop file and icon
        shell: bash
        run: |
          cd build
          cat > EnsteinStockManager.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Enstein Stock Manager
          Exec=EnsteinStockManager
          Icon=enstein-stock-manager
          Categories=Office;
          EOF
          cat > enstein-stock-manager.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" fill="#1f3b57"/>
            <text x="50%" y="54%" text-anchor="middle" font-family="Sans" font-size="56" fill="#ffffff">ESM</text>
          </svg>
          EOF
          mkdir -p icons/hicolor/256x256/apps
          cp enstein-stock-manager.svg icons/hicolor/256x256/apps/enstein-stock-manager.svg

      - name: Create Linux AppImage
        shell: bash
        run: |
          cd build
          ../squashfs-root/AppRun EnsteinStockManager.desktop -qmldir=.. -appimage -no-copy-copyright-files
          mv EnsteinStockManager-x86_64.AppImage ../EnsteinStockManager-Linux.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: EnsteinStockManager-Linux.AppImage

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            EnsteinStockManager-Windows.zip
            EnsteinStockManager-Linux.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
